<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Portfolio Style Comparison</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0f13;
      color: #ecebe7;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; }

    body {
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 0%, rgba(209, 191, 174, 0.08), transparent 32%),
        radial-gradient(circle at 82% 0%, rgba(69, 180, 141, 0.08), transparent 32%),
        #0d0f13;
    }

    a { color: inherit; text-decoration: none; }

    .comparison-toolbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 2;
      height: 72px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(14, 16, 20, 0.82);
      backdrop-filter: blur(22px) saturate(145%);
      -webkit-backdrop-filter: blur(22px) saturate(145%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .theme-heading {
      min-width: 0;
    }

    .theme-heading:last-child { text-align: right; }

    .theme-name {
      display: block;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .theme-note {
      display: block;
      margin-top: 2px;
      color: #92949c;
      font-size: 11px;
    }

    .comparison-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comparison-link,
    .sync-control {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 999px;
      color: #c7c7cb;
      background: rgba(255, 255, 255, 0.055);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .comparison-link:hover { color: #54c49e; }
    .sync-control input { accent-color: #45b48d; }

    .comparison-grid {
      height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      padding-top: 72px;
      background: rgba(255, 255, 255, 0.12);
    }

    .preview-panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #15171c;
    }

    iframe {
      display: block;
      width: 151.52%;
      height: 151.52%;
      border: 0;
      background: #0d0f13;
      transform: scale(0.66);
      transform-origin: top left;
    }

    @media (max-width: 820px) {
      body { overflow: auto; }

      .comparison-toolbar {
        position: relative;
        height: auto;
        grid-template-columns: 1fr 1fr;
        padding: 12px;
      }

      .comparison-actions {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-content: center;
      }

      .comparison-grid {
        height: auto;
        min-height: calc(200dvh - 106px);
        grid-template-columns: 1fr;
        grid-template-rows: repeat(2, calc(100dvh - 106px));
        padding-top: 0;
      }

      iframe {
        width: 100%;
        height: 100%;
        transform: none;
      }
    }

    @media (max-width: 470px) {
      .comparison-link { display: none; }
      .theme-note { font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="comparison-toolbar">
    <div class="theme-heading">
      <span class="theme-name">Neumorphism</span>
      <span class="theme-note">Opaque, raised, softly pressed</span>
    </div>

    <div class="comparison-actions">
      <a class="comparison-link" href="index.html">Default site</a>
      <label class="sync-control">
        <input id="sync-scroll" type="checkbox" checked />
        Sync scroll
      </label>
    </div>

    <div class="theme-heading">
      <span class="theme-name">Liquid glass</span>
      <span class="theme-note">Translucent, refractive, adaptive</span>
    </div>
  </header>

  <main class="comparison-grid">
    <section class="preview-panel" aria-label="Neumorphism portfolio preview">
      <iframe id="neumorphism-frame" src="index.html?theme=neumorphism" title="Roman Licursi portfolio in neumorphism"></iframe>
    </section>
    <section class="preview-panel" aria-label="Liquid glass portfolio preview">
      <iframe id="liquid-glass-frame" src="index.html?theme=liquid-glass" title="Roman Licursi portfolio in liquid glass"></iframe>
    </section>
  </main>

  <script>
    const syncToggle = document.getElementById('sync-scroll');
    const leftFrame = document.getElementById('neumorphism-frame');
    const rightFrame = document.getElementById('liquid-glass-frame');
    const loadedFrames = new WeakSet();
    let syncing = false;

    function scrollRange(frame) {
      const view = frame.contentWindow;
      const doc = frame.contentDocument?.documentElement;
      if (!view || !doc) return null;
      return Math.max(1, doc.scrollHeight - view.innerHeight);
    }

    function linkScroll(source, target) {
      let boundDocument = null;
      let scrollFrame = 0;

      function bindSourceScroll() {
        if (!source.contentDocument || source.contentDocument === boundDocument) return;
        boundDocument = source.contentDocument;
        loadedFrames.add(source);
        try {
          source.contentWindow.addEventListener('scroll', () => {
            if (!syncToggle.checked || syncing || scrollFrame || !loadedFrames.has(target)) return;
            scrollFrame = requestAnimationFrame(() => {
              scrollFrame = 0;
              const sourceRange = scrollRange(source);
              const targetRange = scrollRange(target);
              if (!sourceRange || !targetRange) return;
              syncing = true;
              const progress = source.contentWindow.scrollY / sourceRange;
              target.contentWindow.scrollTo({
                top: progress * targetRange,
                behavior: 'auto'
              });
              requestAnimationFrame(() => { syncing = false; });
            });
          }, { passive: true });
        } catch {
          syncToggle.checked = false;
          syncToggle.disabled = true;
        }
      }

      source.addEventListener('load', bindSourceScroll);
      if (source.contentDocument?.readyState === 'complete') bindSourceScroll();
    }

    linkScroll(leftFrame, rightFrame);
    linkScroll(rightFrame, leftFrame);
  </script>
</body>
</html>
